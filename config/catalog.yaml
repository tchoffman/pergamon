# Pergamon catalog — the "menu" `pergamon setup` chooses from.
#
# This is a machine-readable list of every dataset the pergamon can install,
# with each item's options (variants, size filters, URL patterns, licensing).
# The install.yaml / install.local.yaml files reference entries here by `id`
# and set per-entry options.
#
# Fields:
#   id:           stable key referenced from install.yaml
#   title:        human-readable name shown in setup TUI
#   shelf:        logical grouping (reference | medical | repair | ...)
#   fetcher:      which scripts/fetchers/*.sh handles this
#   description:  one-line pitch shown in the TUI
#   options:      list of configurable knobs (variant/count/etc.)
#   defaults:     default values for those options
#   size_mb:      typical size for the default (rough, informational)

version: 1

# ────────────────────────────────── Models ──────────────────────────────────
# Which Ollama tags are available to pick as primary (LLM) or embedding model.
# Install config (install.local.yaml → models:) names one of each by id.
#
# Primary model is chosen for speed/quality trade-off; embedding model
# selection matters more carefully — swapping it requires reindexing the whole
# corpus (vector dimensions differ).

models:
  primary:
    - id: qwen3.5-9b
      ollama_tag: qwen3.5:9b
      size_mb: 7600
      notes: >-
        Default. Best tested on a 16 GB Mac: 20/21 on pergamon eval, ~15s
        radio answers. Run with think off (rag/config.yaml).
    - id: gemma4-12b
      ollama_tag: gemma4:12b
      size_mb: 7700
      notes: >-
        Also 20/21 on pergamon eval, a bit slower than Qwen on 16 GB and
        tight on memory there. Comfortable on 24 GB+.
    - id: llama3.1-8b-q4
      ollama_tag: llama3.1:8b-instruct-q4_K_M
      size_mb: 4900
      notes: >-
        Previous default (2024). Noticeably weaker: repeated outdated first aid
        and couldn't tell off-topic library passages from relevant ones.
    - id: llama3.1-8b-q8
      ollama_tag: llama3.1:8b-instruct-q8_0
      size_mb: 8500
      notes: Higher quality 8B. Comfortable on 24 GB+.
    - id: qwen2.5-7b-q4
      ollama_tag: qwen2.5:7b-instruct-q4_K_M
      size_mb: 4700
      notes: Strong alternative to llama. Good at reasoning / math.
    - id: qwen2.5-14b-q4
      ollama_tag: qwen2.5:14b-instruct-q4_K_M
      size_mb: 9000
      notes: Mid-size. Noticeably sharper; needs 24 GB+ RAM.
    - id: phi-3.5-mini
      ollama_tag: phi3.5:3.8b-mini-instruct-q4_K_M
      size_mb: 2300
      notes: Tiny. For low-resource machines or faster responses.
    - id: llama3.3-70b-q4
      ollama_tag: llama3.3:70b-instruct-q4_K_M
      size_mb: 43000
      notes: Cage-class. Needs 48 GB+ unified memory. Patient users only.
  embedding:
    - id: nomic-embed-text
      ollama_tag: nomic-embed-text
      size_mb: 274
      dim: 768
      notes: Default. Fast, well-tested, 768-dim.
    - id: mxbai-embed-large
      ollama_tag: mxbai-embed-large
      size_mb: 670
      dim: 1024
      notes: Higher quality. 1024-dim — reindex required if you switch.
    - id: bge-m3
      ollama_tag: bge-m3
      size_mb: 1200
      dim: 1024
      notes: >-
        BGE M3. Multilingual (100+ languages), 1024-dim; reindex required if
        you switch. Ollama has no base-size BGE model.

items:

  # ── Wikipedia family ────────────────────────────────────────────────
  - id: wikipedia
    title: Wikipedia (English)
    shelf: reference
    fetcher: kiwix-zim
    description: The core of the pergamon. Choose variant by disk budget.
    kiwix:
      project: wikipedia
      prefix_by_variant:
        simple: wikipedia_en-simple_all_nopic_
        mini:   wikipedia_en_all_mini_
        nopic:  wikipedia_en_all_nopic_
        maxi:   wikipedia_en_all_maxi_
    options:
      - name: variant
        prompt: "Which Wikipedia variant?"
        choices:
          - value: simple
            label: "Simple English (text-only) — ~1 GB"
          - value: mini
            label: "Full English summaries only — ~14 GB"
          - value: nopic
            label: "Full English, text-only — ~53 GB  (sweet spot)"
          - value: maxi
            label: "Full English with images+video — ~127 GB"
    defaults:
      variant: simple
    size_mb_by_variant:
      simple: 1050
      mini: 14400
      nopic: 52700
      maxi: 127000

  - id: wiktionary
    title: Wiktionary (English)
    shelf: reference
    fetcher: kiwix-zim
    description: Dictionary, etymologies, translations.
    kiwix:
      project: wiktionary
      prefix_by_variant:
        simple: wiktionary_en-simple_all_nopic_
        nopic:  wiktionary_en_all_nopic_
    options:
      - name: variant
        prompt: "Which Wiktionary variant?"
        choices:
          - value: simple
            label: "Simple English — ~100 MB"
          - value: nopic
            label: "Full English — ~1 GB"
    defaults:
      variant: simple
    size_mb_by_variant:
      simple: 100
      nopic: 1000

  - id: wikibooks
    title: Wikibooks (textbooks + manuals)
    shelf: reference
    fetcher: kiwix-zim
    description: Textbooks — math, chemistry, programming, languages.
    kiwix:
      project: wikibooks
      prefix_by_variant:
        nopic: wikibooks_en_all_nopic_
    options: []
    defaults:
      variant: nopic
    size_mb_by_variant:
      nopic: 5000

  - id: wikisource
    title: Wikisource (primary texts)
    shelf: reference
    fetcher: kiwix-zim
    description: Primary-source documents — legal, historical, religious.
    kiwix:
      project: wikisource
      prefix_by_variant:
        nopic: wikisource_en_all_nopic_
    options: []
    defaults:
      variant: nopic
    size_mb_by_variant:
      nopic: 10000

  - id: wikiquote
    title: Wikiquote
    shelf: classics
    fetcher: kiwix-zim
    description: Curated quotes. For morale.
    kiwix:
      project: wikiquote
      prefix_by_variant:
        nopic: wikiquote_en_all_nopic_
    options: []
    defaults:
      variant: nopic
    size_mb_by_variant:
      nopic: 1000

  - id: wikiversity
    title: Wikiversity (free courses)
    shelf: education
    fetcher: kiwix-zim
    description: Free course materials across disciplines.
    kiwix:
      project: wikiversity
      prefix_by_variant:
        nopic: wikiversity_en_all_nopic_
    options: []
    defaults:
      variant: nopic
    size_mb_by_variant:
      nopic: 1000

  - id: wikivoyage
    title: Wikivoyage
    shelf: reference
    fetcher: kiwix-zim
    description: Travel guide — practical geography, routes, local info.
    kiwix:
      project: wikivoyage
      prefix_by_variant:
        nopic: wikivoyage_en_all_nopic_
        maxi:  wikivoyage_en_all_maxi_
    options:
      - name: variant
        prompt: "Wikivoyage variant?"
        choices:
          - value: nopic
            label: "Text only — ~500 MB"
          - value: maxi
            label: "With images — ~2 GB"
    defaults:
      variant: nopic
    size_mb_by_variant:
      nopic: 500
      maxi: 2000

  # ── Repair / DIY ────────────────────────────────────────────────────
  - id: ifixit
    title: iFixit repair manuals
    shelf: repair
    fetcher: kiwix-zim
    description: Thousands of repair guides for electronics and appliances.
    kiwix:
      project: ifixit
      prefix_by_variant:
        all: ifixit_en_all_
    options: []
    defaults:
      variant: all
    size_mb_by_variant:
      all: 3400

  - id: appropedia
    title: Appropedia (DIY sustainability)
    shelf: low-tech
    fetcher: kiwix-zim
    description: Wiki of appropriate-tech / DIY sustainability projects.
    kiwix:
      project: other
      prefix_by_variant:
        all: appropedia_en_all_maxi_
    options: []
    defaults:
      variant: all
    size_mb_by_variant:
      all: 500

  - id: arch-wiki
    title: Arch Linux Wiki
    shelf: computing
    fetcher: kiwix-zim
    description: Best general Linux reference, even if you don't run Arch.
    kiwix:
      project: other
      prefix_by_variant:
        all: archlinux_en_all_maxi_
    options: []
    defaults:
      variant: all
    size_mb_by_variant:
      all: 40

  # ── Education ───────────────────────────────────────────────────────
  - id: khan-academy
    title: Khan Academy
    shelf: education
    fetcher: kiwix-zim
    description: >-
      K–12 courses (math, science, humanities), with video. Kiwix only offers
      the full English set (2023, ~168 GB); there is no smaller edition.
    kiwix:
      project: other
      prefix_by_variant:
        all: khanacademy_en_all_
    options: []
    defaults:
      variant: all
    size_mb_by_variant:
      all: 172000

  # ── Classics / Morale ───────────────────────────────────────────────
  - id: gutenberg
    title: Project Gutenberg (top N books)
    shelf: classics
    fetcher: gutenberg
    description: Public-domain classics. Choose how many of the top-downloaded.
    options:
      - name: top_n
        prompt: "How many top books?"
        choices:
          - value: 100
            label: "Top 100 — ~300 MB"
          - value: 500
            label: "Top 500 — ~1.5 GB"
          - value: 2000
            label: "Top 2000 — ~6 GB"
          - value: 10000
            label: "Top 10000 — ~30 GB"
    defaults:
      top_n: 500
    size_mb_by_option:
      top_n:
        100: 300
        500: 1500
        2000: 6000
        10000: 30000

  - id: standard-ebooks
    title: Standard Ebooks
    shelf: classics
    fetcher: mirror-site
    description: Beautifully-formatted public-domain classics.
    mirror:
      # The OPDS feed (/opds/all) now needs a Patrons Circle login; the
      # public catalog pages don't.
      seed_url: https://standardebooks.org/ebooks
      allowed_hosts: ["standardebooks.org"]
    options: []
    defaults: {}
    size_mb_by_variant:
      default: 2000

  # ── Technical Q&A ───────────────────────────────────────────────────
  - id: stackexchange
    title: Stack Exchange dumps
    shelf: technical-qa
    fetcher: stackexchange
    description: Full Q&A dumps from archive.org. Pick the sites you want.
    options:
      - name: sites
        prompt: "Which Stack Exchange sites?"
        multi: true
        choices:
          - value: outdoors
            label: "Outdoors — hiking, camping, hunting (~150 MB)"
          - value: gardening
            label: "Gardening & Landscaping (~200 MB)"
          - value: cooking
            label: "Seasoned Advice (cooking) (~500 MB)"
          - value: homebrew
            label: "Homebrewing (~80 MB)"
          - value: bicycles
            label: "Bicycles (~200 MB)"
          - value: diy
            label: "DIY Home Improvement (~500 MB)"
          - value: woodworking
            label: "Woodworking (~150 MB)"
          - value: electronics
            label: "Electrical Engineering (~1 GB)"
          - value: sustainability
            label: "Sustainability (~30 MB)"
          - value: biology
            label: "Biology (~300 MB)"
          - value: chemistry
            label: "Chemistry (~400 MB)"
          - value: physics
            label: "Physics (~1 GB)"
          - value: ham
            label: "Amateur Radio (~80 MB)"
          - value: aviation
            label: "Aviation (~400 MB)"
          - value: mechanics
            label: "Motor Vehicle Maintenance (~200 MB)"
    defaults:
      sites: ["outdoors", "gardening", "cooking", "homebrew", "diy"]

  # ── Low-tech reference ──────────────────────────────────────────────
  - id: low-tech-magazine
    title: Low-Tech Magazine (mirror)
    shelf: low-tech
    fetcher: mirror-site
    description: Appropriate-tech articles archive.
    mirror:
      seed_url: https://www.lowtechmagazine.com/
      allowed_hosts: ["www.lowtechmagazine.com", "lowtechmagazine.com"]
      depth: 3
    options: []
    defaults: {}
    size_mb_by_variant:
      default: 500

  - id: tldp
    title: Linux Documentation Project (mirror)
    shelf: computing
    fetcher: mirror-site
    description: Classic HOWTOs, Guides. Grab the full site.
    mirror:
      seed_url: https://tldp.org/
      allowed_hosts: ["tldp.org"]
      depth: 5
    options: []
    defaults: {}
    size_mb_by_variant:
      default: 500

  - id: meshtastic-docs
    title: Meshtastic documentation (mirror)
    shelf: comms
    fetcher: mirror-site
    description: Full docs.meshtastic.org for the mesh module.
    mirror:
      seed_url: https://meshtastic.org/docs/
      allowed_hosts: ["meshtastic.org"]
      depth: 4
    options: []
    defaults: {}
    size_mb_by_variant:
      default: 50

  # ── Survival PDFs (public domain) ───────────────────────────────────
  - id: fm-21-76-survival
    title: FM 21-76 Army Survival
    shelf: medical
    fetcher: archive-pdf
    description: Canonical US Army survival manual.
    archive:
      url: https://archive.org/download/USArmyFM2176/US_Army-FM21-76.pdf
      url_fallbacks:
        - https://archive.org/download/FM2176USARMYSURVIVALMANUAL/FM%2021-76%20%20US%20ARMY%20SURVIVAL%20MANUAL.pdf
        - https://archive.org/download/MilitaryManual-Fm21-76USArmySurvivalManual/fm21-76%20%28US%20Army%20Survival%20Manual%29.pdf
        - https://info.publicintelligence.net/USArmy-FM21-76-SurvivalManual.pdf
        - https://www.survivalebooks.com/pdf/US%20Army%20Survival%20Manual%20FM%2021-76.pdf
    options: []
    defaults: {}
    size_mb_by_variant:
      default: 6

  - id: fm-3-05-70-survival
    title: FM 3-05.70 SERE (Survival, Evasion, Resistance, Escape)
    shelf: medical
    fetcher: archive-pdf
    description: Army SERE manual.
    archive:
      url: https://archive.org/download/fm-3-05.70-survival-2002/FM%203-05.70%20Survival%20%202002.pdf
      url_fallbacks:
        - https://archive.org/download/milmanual-fm-3-05.70-survival/fm-3-05.70-survival.pdf
        - https://info.publicintelligence.net/USArmySurvivalFM3-05-70.pdf
    options: []
    defaults: {}
    size_mb_by_variant:
      default: 4

  # ── Foraging + plant / mushroom identification ─────────────────────
  # Public-domain field guides (US), verified on Project Gutenberg. The
  # mushroom guides date from c.1880–1920: some species they call edible
  # are now known to be toxic. The foraging safety rules (config/domains/
  # foraging.yaml) tell the model never to rely on them for edibility.
  - id: foraging-shelf
    title: Foraging + plant/mushroom field guides (public domain)
    shelf: foraging
    fetcher: gutenberg
    description: 12 classic field guides — mushrooms, wild flowers, poisonous and medicinal plants.
    gutenberg_ids:
      - {id: 26492, slug: atkinson-studies-of-american-fungi}
      - {id: 51393, slug: mcilvaine-one-thousand-american-fungi}
      - {id: 29086, slug: hard-mushroom-edible-and-otherwise}
      - {id: 32982, slug: taylor-mushrooms-of-america}
      - {id: 46514, slug: gibson-edible-toadstools-and-mushrooms}
      - {id: 60159, slug: watling-identification-of-larger-fungi}
      - {id: 71397, slug: youngken-poisonous-plants-new-england}
      - {id: 63788, slug: long-plants-poisonous-to-livestock}
      - {id: 76922, slug: henkel-weeds-used-in-medicine}
      - {id: 49513, slug: culpeper-complete-herbal}
      - {id: 47971, slug: armstrong-western-wild-flowers}
      - {id: 8866, slug: blanchan-wild-flowers-worth-knowing}
    options: []
    defaults: {}
    size_mb_by_variant:
      default: 12

  # ── Maps ────────────────────────────────────────────────────────────
  - id: usgs-topo
    title: USGS topographic maps (US only)
    shelf: maps
    fetcher: usgs-topo
    description: >-
      Printable topo maps around a place: contour lines, streams, springs,
      ponds, lakes, wetlands, woodland and trails. The historical edition
      (often 1900s-1950s) also shows old homesteads, orchards, mills and
      mines. GeoPDFs: any PDF viewer, or Avenza Maps / QGIS with GPS.
    options:
      - name: area
        prompt: "Around which place? (a town, or lat,lon)"
        type: string
        placeholder: "Asheville, NC"
      - name: radius_mi
        prompt: "How many miles around it?"
        choices:
          - value: 5
            label: "5 miles: ~6 maps (~350 MB current, ~100 MB historical)"
          - value: 10
            label: "10 miles: ~12 maps (~700 MB current, ~200 MB historical)"
          - value: 25
            label: "25 miles: ~50 maps (~3 GB current, ~1 GB historical)"
      - name: editions
        prompt: "Which editions?"
        multi: true
        choices:
          - value: current
            label: "Current US Topo (~55 MB per map)"
          - value: historical
            label: "Oldest detailed historical edition (~15 MB per map)"
    defaults:
      area: ""
      radius_mi: 10
      editions: [current, historical]
    size_mb_by_option:
      radius_mi:
        5: 450
        10: 900
        25: 4000

  - id: osm-regional
    title: OpenStreetMap regional packs (OsmAnd format)
    shelf: maps
    fetcher: osmand-region
    description: Vector maps for offline nav. Pick regions.
    options:
      - name: regions
        prompt: "Which regions? (comma-separated OsmAnd region codes)"
        type: string
        placeholder: "us-georgia,us-north-carolina,germany-berlin"
      - name: layers
        prompt: "Which map layers?"
        multi: true
        choices:
          - value: streets
            label: "Street map: roads, trails, water, woods, places (~470 MB/US state)"
          - value: contours-feet
            label: "Contour lines in feet (~55 MB/US state)"
          - value: contours-meters
            label: "Contour lines in meters (~65 MB/US state)"
          - value: hillshade
            label: "Hillshade: shaded relief, hills at a glance (~75 MB/US state)"
          - value: slope
            label: "Slope steepness shading (~160 MB/US state)"
          - value: wikipedia
            label: "Wikipedia articles as map points (~70 MB/US state)"
    defaults:
      regions: []
      layers: [streets]
    # Size varies; typically 300-800 MB per US state
