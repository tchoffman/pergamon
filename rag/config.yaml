# Pergamon RAG configuration. Edit in-place; no code changes needed.

# Ollama endpoint. Default is the local server started by scripts/install-deps.sh.
ollama_host: http://localhost:11434

# Models (should match names in rag/models.yaml).
llm_model: llama3.1:8b-instruct-q4_K_M
embedding_model: nomic-embed-text

# Chroma persistent directory (inside build/ so it's gitignored).
chroma_dir: build/chroma
chroma_collection: pergamon_corpus

# Chunking parameters for PDF ingestion.
chunk_size: 1200          # characters per chunk
chunk_overlap: 150        # character overlap between adjacent chunks

# Retrieval parameters for `pergamon ask`.
retrieve_k: 6             # top-K chunks to pull from Chroma
max_context_chars: 8000   # cap context fed to the LLM to stay within window
# Library passages farther than this (Chroma L2 distance, lower = closer) are not
# shown to the LLM when answering. On-topic matches score ~150-300; unrelated
# ones ~450. Raise it to lean on the library more, lower it to lean on it less.
max_distance: 350
# Before answering, ask the model which of the top passages actually answer the
# question (one extra model call, a few seconds). Off-topic passages that pass
# max_distance are dropped instead of steering the answer.
vet_passages: true
vet_max: 4

# Where this install is, e.g. "Marietta, Georgia, USA". Told to the model with
# today's date so "what should I plant now?" gets a local answer. Set it in
# config/install.local.yaml (location: ...) to keep it out of git.
location: ""

# Generation parameters.
temperature: 0.2          # low → factual; raise for more exploratory answers
num_ctx: 8192             # LLM context window (model-dependent)
