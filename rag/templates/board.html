{% extends "_base.html" %}
{% block title %}Pergamon · Board{% endblock %}
{% block app_name %}<span class="app-name">Board</span>{% endblock %}
{% block head %}
  <script src="/static/vendor/noble-nostr.js"></script>
  <script src="/static/pergamon.js"></script>
{% endblock %}
{% block content %}
    <section>
      <form id="filterForm">
        <select id="cat" aria-label="category">
          <option value="">All categories</option>
          {% for key, title in categories.items() %}
          <option value="{{ key }}">{{ title }}</option>
          {% endfor %}
        </select>
        <button type="submit">Show</button>
      </form>
      <div id="posts"><p class="muted">Loading…</p></div>
    </section>

    <section>
      <h2>Post to the board</h2>
      <p class="muted" id="whoami"></p>
      <form id="postForm">
        <div class="row">
          <label for="p_cat">Category</label>
          <select id="p_cat">
            {% for key, title in categories.items() %}
            <option value="{{ key }}">{{ title }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="row"><label for="p_text">Message</label><textarea id="p_text" rows="4" maxlength="2000" required></textarea></div>
        <div class="row"><label for="p_loc">Location (optional)</label><input id="p_loc" /></div>
        <button type="submit">Post</button>
      </form>
      <div id="postResult" class="muted"></div>
    </section>
{% endblock %}
{% block scripts %}
  <script>
    const el = (tag, cls, text) => {
      const n = document.createElement(tag);
      if (cls) n.className = cls;
      if (text !== undefined) n.textContent = text;
      return n;
    };

    async function load() {
      const box = document.getElementById("posts");
      const cat = document.getElementById("cat").value;
      try {
        const r = await fetch("/api/board" + (cat ? "?category=" + cat : ""));
        const data = await r.json();
        box.innerHTML = "";
        if (!data.posts.length) { box.appendChild(el("p", "muted", "Nothing posted in the last 30 days.")); return; }
        data.posts.forEach(p => {
          const c = el("div", "listing");
          const head = el("div", "listing-head");
          head.appendChild(el("span", p.category === "warning" ? "badge want" : "badge offer", p.category_title.toUpperCase()));
          head.appendChild(el("span", "muted small",
            "  " + new Date(p.created_at * 1000).toLocaleString() + " · " + (p.author || p.pubkey.slice(0, 8) + "…")));
          c.appendChild(head);
          c.appendChild(el("p", "", p.text));
          if (p.location) c.appendChild(el("div", "muted small", p.location));
          c.dataset.pubkey = p.pubkey;
          PergamonModerate.controls(c, { id: p.id, pubkey: p.pubkey, kind: 1, preview: p.text },
            (pk) => box.querySelectorAll(`[data-pubkey="${pk}"]`).forEach((n) => n.remove()));
          box.appendChild(c);
        });
      } catch (e) {
        box.innerHTML = "";
        box.appendChild(el("p", "warn", "Could not reach relays: " + e));
      }
    }

    document.getElementById("filterForm").addEventListener("submit", e => { e.preventDefault(); load(); });

    const HUB = {{ (active.display_name or active.name) | tojson if active else "null" }};
    const form = document.getElementById("postForm");
    function whoami() {
      const k = Pergamon.Keys.get();
      const box = document.getElementById("whoami");
      if (k) box.textContent = "Posting as " + (k.name || "you") + " (this device's key). Every post is signed.";
      else if (HUB) box.textContent = "Posting as the hub identity “" + HUB + "”. To post as yourself, create a key on the Welcome page.";
      else box.innerHTML = 'No key yet — <a href="/welcome">create one</a> to post.';
      form.classList.toggle("hidden", !k && !HUB);
    }
    form.addEventListener("submit", async e => {
      e.preventDefault();
      const out = document.getElementById("postResult");
      out.textContent = "posting…";
      const body = {
        category: document.getElementById("p_cat").value,
        text: document.getElementById("p_text").value,
        location: document.getElementById("p_loc").value,
      };
      try {
        const data = Pergamon.Keys.has()
          ? await Pergamon.signAndPublish("/api/draft/board", body)
          : await Pergamon.postJSON("/api/board", body);
        out.textContent = "posted. " + Object.entries(data.published_to)
          .map(([u, v]) => `${v.ok ? "✓" : "✗"} ${u}`).join("  ");
        form.reset();
        load();
      } catch (err) {
        out.textContent = "error: " + err.message;
      }
    });
    whoami();

    load();
  </script>
{% endblock %}
