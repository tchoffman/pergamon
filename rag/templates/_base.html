<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>{% block title %}Pergamon{% endblock %}</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#fafaf7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1a1816" media="(prefers-color-scheme: dark)" />
  <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/icon-32.png" />
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Pergamon" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="stylesheet" href="/static/style.css" />
  {% block head %}{% endblock %}
</head>
<body>
  <header class="appbar">
    <a href="/" class="home-link" aria-label="Pergamon home">Pergamon</a>
    {% block app_name %}{% endblock %}
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer><span class="muted">Runs on a machine nearby · no internet needed.</span></footer>
  <script src="/static/shell.js"></script>
  <script src="/static/moderate.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
