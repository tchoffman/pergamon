name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: |
          uv venv build/venv
          uv pip install --python build/venv/bin/python -r rag/requirements.txt

      - name: Run unit tests
        run: build/venv/bin/python -m pytest tests/ -v

  browser:
    name: browser end-to-end (headless Chrome, two users)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: |
          uv venv build/venv
          uv pip install --python build/venv/bin/python -r rag/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run browser e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: scripts/e2e-browser.sh
